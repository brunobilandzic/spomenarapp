services:
  - type: web
    name: spomenar-demo
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run client-install -- --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
  - type: web
    name: spomenar-public-demo
    runtime: static
    buildCommand: npm --prefix client ci --include=dev && npm --prefix client run build
    staticPublishPath: ./client/build
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: STATIC_DEMO
        value: "true"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
